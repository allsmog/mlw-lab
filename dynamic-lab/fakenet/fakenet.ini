###############################################################################
# FakeNet-NG configuration tuned for Stuxnet detonation.
#
# Stuxnet's original C2 hosts (mypremierfutbol.com, todaysfutbol.com) are dead.
# Run FakeNet on the host (or in a sacrificial VM on the host-only subnet) so
# the sample's DNS / HTTP calls resolve to local listeners instead of failing
# (or, worse, escaping the lab if isolation is mis-configured).
#
# Usage (on the host):
#   sudo python3 -m fakenet -c dynamic-lab/fakenet/fakenet.ini
#
# Then point the detonator VM's DNS at the host-only adapter address
# (192.168.56.1) and re-run the sample.
###############################################################################

[FakeNet]
DivertTraffic:        Yes
NetworkMode:          MultiHost
DiverterLogLevel:     INFO
ProcessBlackList:
ProcessWhiteList:
HostBlackList:
HostWhiteList:

[Diverter]
RedirectAllTraffic:   Yes
DefaultTCPListener:   RawTCPListener
DefaultUDPListener:   RawUDPListener

###############################################################################
# DNS — answer everything Stuxnet looks up.
###############################################################################
[DNS Server]
Enabled:              True
Port:                 53
Protocol:             UDP
Listener:             DNSListener
DNSResponse:          192.168.56.1
NXDomains:            0

###############################################################################
# HTTP — Stuxnet's C2 used HTTP GETs to POST-style query strings.
# Specific known callbacks (now historical):
#   /index.php?data=<encoded>
###############################################################################
[HTTP Server]
Enabled:              True
Port:                 80
Protocol:             TCP
Listener:             HTTPListener
UseSSL:               No
Webroot:              defaultFiles/

[HTTPS Server]
Enabled:              True
Port:                 443
Protocol:             TCP
Listener:             HTTPListener
UseSSL:               Yes
Webroot:              defaultFiles/

###############################################################################
# SMB — needed for share-enumeration / lateral movement experiments.
###############################################################################
[SMB Server]
Enabled:              True
Port:                 445
Protocol:             TCP
Listener:             SMBListener

[NetBIOS Session Service]
Enabled:              True
Port:                 139
Protocol:             TCP
Listener:             SMBListener

###############################################################################
# Generic catchalls so anything else gets logged rather than dropped.
###############################################################################
[RawTCPListener]
Enabled:              True
Port:                 1337
Protocol:             TCP
Listener:             RawListener
UseSSL:               No
Timeout:              10
TaskBased:            No
Hidden:               False

[RawUDPListener]
Enabled:              True
Port:                 1337
Protocol:             UDP
Listener:             RawListener
UseSSL:               No
Timeout:              10
TaskBased:            No
Hidden:               False
